name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The gate the build brief asks for: a malformed module.json fails CI.
      # scripts/validate-content.mjs runs module.schema.json over all 16
      # modules, then checks every file they point at actually exists.
      - name: Validate content against schema/module.schema.json
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
